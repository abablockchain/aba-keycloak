version: "3"

services:
  aba-certbot:
    image: certbot/certbot
    restart: always
    container_name: aba-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done'
    
networks:
  postgres_default:
    external: true
